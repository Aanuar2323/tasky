name: Build Tasky Desktop (Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'scripts/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '22.19.0'
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Install MSVC
        uses: microsoft/setup-msvc@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build -w apps/web

      - name: Copy assets to apps/desktop/dist
        run: node scripts/prebuild-desktop.mjs

      - name: Download Node.js portable
        shell: pwsh
        run: |
          $BINARIES = "$PWD\apps\desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Force -Path $BINARIES | Out-Null
          $NODE_BIN = Join-Path $BINARIES "node-$env:RUST_TARGET.exe"
          if (-Not (Test-Path $NODE_BIN)) {
            Write-Host "Downloading Node.js portable from nodejs.org..."
            Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NODE_VERSION/win-x64/node.exe" -OutFile $NODE_BIN
          }
          Write-Host "Node sidecar at: $NODE_BIN"

      - name: Build Tauri NSIS installer
        run: npx tauri build --target $env:RUST_TARGET
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasky-setup-windows
          path: apps/desktop/src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 6

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tasky-setup-windows
          path: artifacts
      - run: ls -lR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe