name: tasky

services:
  tasky:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8787
    image: tasky:latest
    container_name: tasky
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=8787
      - WEB_PORT=3000
      - HOSTNAME=0.0.0.0
      - STORAGE_ROOT=/app/storage
      - CORS_ORIGIN=http://localhost:3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8787
    volumes:
      - ./storage:/app/storage
    ports:
      - "3000:3000"
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null && wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
