<!--
  index.html — Página HTML raíz de la aplicación web

  Este es el punto de entrada del frontend. Vite lo usa como plantilla
  y carga el bundle de React a través de main.tsx.

  Estructura:
    - <div id="root">: Contenedor donde React monta toda la aplicación
    - <script type="module">: Carga main.tsx como módulo ES (Vite lo transpila al vuelo)
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
    <title>Task</title>
  </head>
  <body>
    <!-- Contenedor principal donde React renderiza toda la UI -->
    <div id="root"></div>
    <!-- Punto de entrada del código React (Vite lo sirve y transpila automáticamente) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
